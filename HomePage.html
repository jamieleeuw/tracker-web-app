<!doctype html>

<html lang="en">
    <head>

        <title>Home Page</title>

        <!-- Required meta tags -->
        <meta charset="utf-8" />

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
        
        <link rel="icon" type="Images/x-icon" href="Images/dumbbell-logo.png"/>
        <link rel="stylesheet" href="HomePage.css">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="HomePage.js" defer></script>
        <script src="tracker.js" defer></script>
        <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>

    </head>

    <body class="bg-dark">  

        <header>
            <!-- navbar code -->
            <nav class="navbar navbar-expand-lg navbar-light bg-primary fixed-top">
              <div class="container-fluid">
                  <!-- Logo -->
                  <a class="navbar-brand" href="HomePage.html">
                      <img src="Images/dumbbell-logo.png" alt="dumbbell-logo" width="30" height="24" class="d-inline-block align-text-top">
                      Vital Trak
                  </a>
          
                  <!-- Navbar Toggler (for small screens) -->
                  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                      <span class="navbar-toggler-icon"></span>
                  </button>
          
                  <!-- Navbar Links -->
                  <div class="collapse navbar-collapse" id="navbarNav">
                      <ul class="navbar-nav me-auto">
                          <li class="nav-item">
                              <a class="nav-link active" href="HomePage.html">Home</a>
                          </li>
                          <li class="nav-item">
                              <a class="nav-link" href="Workouts.html">Workouts</a>
                          </li>
                          <li class="nav-item">
                              <a class="nav-link" href="Tracker.html">Fitness Tracker</a>
                          </li>
                          <li class="nav-item">
                              <a class="nav-link" href="Achievements.html">Achievements</a>
                          </li> 
                      </ul>
                  </div>
              </div>
          </nav>
          

        </header>

        <main class="container mt-4 text-light">
            <section class="welcome-panel">
                <div>
                    <p class="eyebrow mb-2">YOUR FITNESS OVERVIEW</p>
                    <h1 id="user-name" class="mb-2"></h1>
                    <p class="welcome-copy mb-0">Keep your momentum going with a clear view of every session.</p>
                </div>
                <button type="button" class="btn btn-primary btn-lg log-workout-trigger" data-bs-toggle="modal" data-bs-target="#logWorkoutModal">
                    <span aria-hidden="true">+</span> Log Workout
                </button>
            </section>
            <div class="row mt-4">
                <div class="col-md-6 chart-container">
                    <h3>Workout Counts</h3>
                    <canvas id="workout-counts-chart"></canvas>
                </div>
                <div class="col-md-6 chart-container">
                    <h3>Calories Burned</h3>
                    <canvas id="calories-burned-chart"></canvas>
                </div>
            </div>
            <div class="row mt-4">
                <div class="col-md-6 chart-container">
                    <h3>Average Workout Duration</h3>
                    <canvas id="average-workout-duration-chart"></canvas>
                </div>
                <div class="col-md-6 text-end goal-container">
                    <div class="goal-block">
                        <div id="goal-progress" class="progress-circle" data-progress="0"></div>
                        <h2 id="recent-goal">Most Recent Goal</h2>
                    </div>
                </div>
            </div>
            <section class="calendar-section mt-4">
                <div class="section-heading">
                    <div>
                        <p class="eyebrow mb-1">ACTIVITY</p>
                        <h2 class="mb-0">Workout calendar</h2>
                    </div>
                    <span class="section-note">Your logged sessions</span>
                </div>
                <div id="workout-calendar" aria-label="Workout calendar"></div>
            </section>
        </main>

        <!-- Modal for logging workouts -->
        <div class="modal fade" id="logWorkoutModal" tabindex="-1" aria-labelledby="logWorkoutModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="logWorkoutModalLabel">Log Workout</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="logWorkoutForm">
                            <div class="mb-3">
                                <label for="home-workout-type" class="form-label">Workout Type</label>
                                <select class="form-select" id="home-workout-type" required>
                                    <option value="">--Select an option--</option>
                                    <option value="Running">Running</option>
                                    <option value="Swimming">Swimming</option>
                                    <option value="Cycling">Cycling</option>
                                    <option value="Strength">Strength</option>
                                </select>
                            </div>
                            <div class="mb-3" id="home-distance-group" hidden>
                                <label for="home-distance" class="form-label">Distance (KM)</label>
                                <input type="number" min="0" step="any" class="form-control" id="home-distance" placeholder="Enter distance">
                            </div>
                            <div class="mb-3" id="home-weight-group" hidden>
                                <label for="home-weight" class="form-label">Weight (KG)</label>
                                <input type="number" min="0" step="any" class="form-control" id="home-weight" placeholder="Enter weight lifted">
                            </div>
                            <div class="mb-3">
                                <label for="workoutCalories" class="form-label">Calories Burned</label>
                                <input type="number" min="1" class="form-control" id="workoutCalories" required>
                            </div>
                            <div class="mb-3">
                                <label for="workoutDuration" class="form-label">Workout Duration (minutes)</label>
                                <input type="number" min="0" class="form-control" id="workoutDuration" required>
                            </div>
                            <div class="mb-3">
                                <label for="workoutDate" class="form-label">Date</label>
                                <input type="date" class="form-control" id="workoutDate" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Log Workout</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </body>
</html>
